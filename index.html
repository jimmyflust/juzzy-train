<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juzzy Train">
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Juzzy Train</title>
<style>
:root{--brand:#BFD4FF;--acc:#1D4ED8;--acc2:#2563EB;--head:#1D4ED8;--headink:#fff;--chip:rgba(255,255,255,.18);--ink:#0F1B2D;--sub:#5B6B82;--bg:#FFFFFF;--card:#FFFFFF;--cardline:#E2E8F2;--line:#D9E1EC;--tint:#EAF1FF;--tint2:#F4F7FC;--inbg:#FFFFFF;--good:#15803D;--goodbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--dl:#475569;--dlbg:#EEF2F7;--navbg:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--head);color:var(--headink);border-bottom:3px solid var(--acc);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;font-style:italic}
h1 .br{color:var(--brand)}
.wk{display:flex;align-items:center;background:var(--chip);border-radius:20px}
.wk button{background:none;border:0;color:var(--headink);font-size:20px;width:34px;height:34px}
.wk span{font-weight:700;font-size:14px;min-width:78px;text-align:center}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:18px;padding:7px 13px;font-weight:600;font-size:14px;background:var(--chip);color:var(--headink)}
.chip.on{background:var(--brand);color:var(--head)}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,27,45,.07);border:1px solid var(--cardline,transparent)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.deload{background:var(--dlbg);color:var(--dl);font-weight:600}
.banner.wu{background:var(--tint2);border-left:4px solid var(--acc2);color:var(--sub)}
.dayhead{border-radius:14px;padding:14px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.dayhead b{font-size:20px;display:block}
.ex .top{display:flex;gap:10px;align-items:flex-start}
.badge{flex:0 0 auto;min-width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.ex h3{margin:0;font-size:16.5px;line-height:1.25}
.meta{color:var(--sub);font-size:13.5px;margin-top:2px}
.note{font-size:13px;color:var(--sub);font-style:italic;margin-top:6px}
.target{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--tint);font-size:14.5px}
.target b{color:var(--acc)}
.target.up{background:var(--goodbg)}
.target.up b{color:var(--good)}
.inputs{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.field{flex:1;display:flex;flex-direction:column}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.field input{width:100%;font-size:20px;font-weight:700;padding:9px 10px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:var(--inbg);-webkit-appearance:none}
.field input:focus{outline:none;border-color:var(--acc2)}
.field input.good{border-color:var(--good);background:var(--goodbg)}
.field input.bad{border-color:var(--bad);background:var(--badbg)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:14px;background:var(--tint);color:var(--acctext,var(--acc))}
.btn.primary{background:var(--acc);color:#fff}
.how{margin-top:10px;display:none}
.how.open{display:block}
.how img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:var(--imgbg)}
.how p{margin:8px 0 0;font-size:14px}
.how .mus{font-weight:700;color:var(--sub);font-size:13px}
.hist{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.hist div{flex:1 0 46px;text-align:center;font-size:11px;color:var(--sub);background:var(--tint2);border-radius:8px;padding:4px 2px}
.hist div b{display:block;font-size:12.5px;color:var(--ink)}
.hist div.cur{outline:2px solid var(--acc2)}
.hist div.g{background:var(--goodbg)}.hist div.r{background:var(--badbg)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
h2{font-size:17px;margin:4px 2px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--tint2);border-radius:10px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase}
.stat b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--sub);text-transform:uppercase}
td.g{color:var(--good);font-weight:700}td.r{color:var(--bad);font-weight:700}
select,input[type=date],input[type=text]{font-size:16px;padding:9px;border:2px solid var(--line);border-radius:10px;width:100%;background:var(--inbg);color:var(--ink);color-scheme:var(--cs,dark)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{flex:1;font-weight:600;font-size:14px}
.row input,.row select{flex:1.2}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);background:var(--inbg);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--sub)}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff}
#timer{position:fixed;inset:0;background:rgba(10,10,10,.95);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#timer.open{display:flex}
#tnum{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums}
#tname{font-size:16px;opacity:.8;padding:0 20px;text-align:center}
#timer .btns{width:min(90vw,360px)}
#timer .btn{background:rgba(255,255,255,.15);color:#fff;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--sub);font-size:13px}
svg.chart{width:100%;height:170px;display:block}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border:2px solid var(--line);background:var(--inbg);color:var(--ink);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.th.on{border-color:var(--acc)}
.th .sw{height:26px;border-radius:7px;margin-bottom:6px;display:block}
.th b{font-size:14px}.th small{font-size:11.5px;color:var(--sub)}
.exnote{width:100%;margin-top:10px;font:14px/1.35 inherit;font-family:inherit;padding:8px 10px;border:1.5px dashed var(--line);border-radius:10px;background:var(--inbg);color:var(--ink);resize:none;overflow:hidden;min-height:38px}
.exnote:focus{outline:none;border-style:solid;border-color:var(--acc2)}
.exnote::placeholder{color:var(--sub);opacity:.8}
.meal{margin-top:12px}.meal label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--acc2)}
.meal .exnote{margin-top:4px}
.mres{margin-top:4px}
.mi{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 2px;border-bottom:1px solid var(--line)}
.mi small{color:var(--sub)}.mi.sub{border:0;color:var(--sub)}.mi.unk{color:var(--bad);border:0}
.mtot{margin-top:12px}.tb{margin-top:8px}.tbl{display:flex;justify-content:space-between;font-size:13.5px}.tbb{height:9px;border-radius:5px;background:var(--tint2);overflow:hidden;margin-top:4px}.tbb div{height:100%;border-radius:5px}
table{font-size:12.5px}
.ex .top{position:relative}
.edit{flex:0 0 auto;order:3;align-self:flex-start;border:1.5px solid var(--line);background:var(--inbg);color:var(--acctext,var(--acc));font-weight:700;font-size:13px;border-radius:9px;padding:6px 11px}
.swp{font-size:12px;color:var(--acc2);font-weight:600;margin-top:2px}
#picker{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column}
#picker.open{display:flex}
.phead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:var(--head);color:var(--headink)}
.phead b{display:block;font-size:17px}.phead small{opacity:.8;font-size:13px}
.pclose{border:0;background:var(--chip);color:var(--headink);width:36px;height:36px;border-radius:50%;font-size:16px}
.psearch{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.psearch input{width:100%;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--inbg);color:var(--ink)}
#plist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(20px + env(safe-area-inset-bottom))}
.pgroup{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--acc2);padding:14px 4px 6px}
.pitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--cardline,var(--line));background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.pitem b{display:block;font-size:15px}.pitem small{display:block;color:var(--sub);font-size:12.5px;margin-top:1px}
.pitem.on{border:2px solid var(--acc)}.pitem i{font-style:normal;font-size:11px;font-weight:700;color:var(--acc);white-space:nowrap}.pitem i.np{color:var(--sub);font-weight:500}
.pitem.reset{background:var(--tint);margin-top:12px}
.saved{font-size:12px;color:var(--good);font-weight:700;margin-left:auto;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
</style>
</head>

  <div class="hrow"><h1 id="title"><span class="br">JUZZY</span> TRAIN</h1>

</nav>

  showMeals();
  document.querySelectorAll('[data-meal]').forEach(t=>{const fit=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};fit();
    t.addEventListener('input',()=>{S.daily[tDate]=S.daily[tDate]||{};const D=S.daily[tDate];D.meals=D.meals||{};D.meals[t.dataset.meal]=t.value;const r=showMeals();if(r.any){D.protein=String(Math.round(r.P));D.kcal=Math.round(r.K);const pi=document.querySelector('[data-k=protein]');if(pi){pi.value=D.protein;pi.classList.remove('good','bad');pi.classList.add(+D.protein>=S.targets.protein?'good':'bad')}}save();fit()});
    t.addEventListener('change',()=>toast('Saved'))});
  $('#td').onchange=e=>{tDate=e.target.value||iso(new Date());rTracker()};
  const upd=(k,v)=>{S.daily[tDate]=S.daily[tDate]||{};S.daily[tDate][k]=v;save()};
  document.querySelectorAll('#sess button').forEach(b=>b.onclick=()=>{upd('session',b.textContent);rTracker();toast('Saved')});
  document.querySelectorAll('[data-k]').forEach(i=>{i.addEventListener('input',()=>upd(i.dataset.k,i.value.replace(',','.')));i.addEventListener('change',()=>{const k=i.dataset.k,T=S.targets;if(T[k]!=null){i.classList.remove('good','bad');if(i.value!=='')i.classList.add(+i.value>=T[k]?'good':'bad')}toast('Saved')})});
}
function rSettings(){
  const T=S.targets;
  let h=`<div class="card"><h2 style="margin-top:0">Colourway</h2><div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${(S.theme||'blue')===k?'on':''}" data-th="${k}"><span class="sw" style="background:linear-gradient(135deg,${t.v.head} 0 50%,${t.v.acc} 50% 100%)"></span><b>${t.label}</b><small>${t.sub}</small></button>`).join('')}</div></div>
  <div class="card"><h2 style="margin-top:0">Program</h2><div class="row"><label>Week 1 starts</label><input type="date" id="sd" value="${S.start}"></div>
  <div class="row"><label>Current week</label><select id="wo"><option value="">Automatic (from start date)</option>${[1,2,3,4,5,6].map(w=>`<option ${S.weekOverride==w?'selected':''} value="${w}">Week ${w}${w===6?' (deload)':''}</option>`).join('')}</select></div></div>
  <div class="card"><h2 style="margin-top:0">Daily targets</h2><div class="row"><label>Protein g</label><input inputmode="numeric" id="tp" value="${T.protein}"></div><div class="row"><label>Calories kcal</label><input inputmode="numeric" id="tk" value="${T.kcal}"></div><div class="row"><label>Water L</label><input inputmode="decimal" id="tw" value="${T.water}"></div><div class="row"><label>Sleep h</label><input inputmode="decimal" id="ts" value="${T.sleep}"></div></div>
  <div class="card"><h2 style="margin-top:0">Backup</h2><p class="muted" style="margin-top:0">Your data lives only on this phone. Save a backup now and then (e.g. to Files or email it to yourself).</p>
  <div class="btns"><button class="btn primary" id="exp">Save backup</button><button class="btn" id="imp">Restore backup</button></div><input type="file" id="impf" accept=".json,application/json" style="display:none"></div>
  <div class="card"><h2 style="margin-top:0">How it works</h2><p class="muted" style="margin:0">Log the weight and the reps of your <b>lowest</b> set. When that hits the top of the rep range, the app tells you to go up. Last set 0–1 reps from failure, other sets 1–2 in reserve. Week 6 is a deload.</p></div>
  <div class="card"><button class="btn" id="rst" style="width:100%;color:var(--bad)">Start a new block (clear workout logs)</button></div>
  <p class="muted" style="text-align:center">Juzzy Train · works offline once added to your Home Screen.</p>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();render();toast(THEMES[S.theme].label)});
  $('#sd').onchange=e=>{if(e.target.value){S.start=e.target.value;save();week=S.weekOverride||autoWeek();header();toast('Saved')}};
  $('#wo').onchange=e=>{S.weekOverride=e.target.value?+e.target.value:null;save();week=S.weekOverride||autoWeek();header();toast('Saved')};
  [['tp','protein'],['tk','kcal'],['tw','water'],['ts','sleep']].forEach(([id,k])=>$('#'+id).onchange=e=>{S.targets[k]=+e.target.value||S.targets[k];save();toast('Saved')});
  $('#exp').onclick=async()=>{const txt=JSON.stringify(S),name='juzzy-backup-'+iso(new Date())+'.json';
    try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();toast('Backup saved')};
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.logs||!o.daily)throw 0;S=migrate(o);save();week=S.weekOverride||autoWeek();const nl=Object.values(S.logs).reduce((a,x)=>a+Object.values(x).filter(v=>v&&v.reps!==''&&v.reps!=null).length,0),nd=Object.keys(S.daily).length;tab='workout';render();alert('Backup restored: '+nl+' workout entries and '+nd+' daily entries.')}catch(_){toast('That file is not a valid backup')}})};
  $('#rst').onclick=()=>{if(confirm('Clear all workout logs and start a new 6-week block from today? (Daily tracker entries are kept.) Save a backup first if unsure.')){S.logs={};S.start=iso(new Date());S.weekOverride=null;save();week=autoWeek();render();toast('New block started')}};
}

let pSlot=null;
function openPicker(slot){pSlot=slot;const D=DAYS.find(d=>d.ex.some(e=>e.id===slot)),e0=D.ex.find(e=>e.id===slot),cur=exFor(e0);
  $('#ptitle').textContent='Change '+e0.code;$('#psub').textContent='Now: '+cur.name;$('#pq').value='';drawPicker();$('#picker').classList.add('open');document.body.style.overflow='hidden';$('#plist').scrollTop=0}
function closePicker(){$('#picker').classList.remove('open');document.body.style.overflow=''}
function drawPicker(){const q=$('#pq').value.trim().toLowerCase();const D=DAYS.find(d=>d.ex.some(e=>e.id===pSlot)),e0=D.ex.find(e=>e.id===pSlot),cur=exFor(e0);
  let h='';if(cur.swapped&&!q)h+=`<button class="pitem reset" data-pick="__reset"><span><b>↺ Back to original</b><small>${e0.name}</small></span></button>`;
  GROUPS.forEach(g=>{const items=LIB.filter(x=>x.group===g&&(!q||(x.name+' '+x.mus+' '+g).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
    if(!items.length)return;h+=`<div class="pgroup">${g}</div>`;
    items.forEach(x=>{const on=x.id===cur.id;h+=`<button class="pitem ${on?'on':''}" data-pick="${x.id}"><span><b>${x.name}</b><small>${x.mus} · ${x.sets}×${x.min}–${x.max}</small></span>${on?'<i>Current</i>':(x.img?'':'<i class="np">no pic</i>')}</button>`})});
  $('#plist').innerHTML=h||'<p class="muted" style="padding:16px">No matches.</p>';
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=b.dataset.pick;S.swaps=S.swaps||{};if(id==='__reset'||id===pSlot)delete S.swaps[pSlot];else S.swaps[pSlot]=id;save();closePicker();const y=scrollY;rWorkout();scrollTo(0,y);toast(id==='__reset'||id===pSlot?'Back to original':'Swapped to '+LIBM[id].name)})}
$('#pq').addEventListener('input',drawPicker);$('#pclose').onclick=closePicker;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
$('#wkm').onclick=()=>{week=Math.max(1,week-1);render()};$('#wkp').onclick=()=>{week=Math.min(6,week+1);render()};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
