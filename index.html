<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juzzy Train">
<meta name="theme-color" content="#7A2E58">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Juzzy Training</title>
<style>
:root{--plum:#7A2E58;--mauve:#A64D79;--ink:#2B1A25;--sub:#6B5A64;--bg:#F6F1F4;--card:#fff;--line:#E5DAE0;--good:#1E7B45;--goodbg:#DDF3E5;--bad:#A3132A;--badbg:#FBE0E4;--deload:#5B6C7D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--plum);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.wk{display:flex;align-items:center;background:rgba(255,255,255,.16);border-radius:20px}
.wk button{background:none;border:0;color:#fff;font-size:20px;width:34px;height:34px}
.wk span{font-weight:700;font-size:14px;min-width:78px;text-align:center}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:18px;padding:7px 13px;font-weight:600;font-size:14px;background:rgba(255,255,255,.16);color:#fff}
.chip.on{background:#fff;color:var(--plum)}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(60,20,40,.08)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.deload{background:#E6EBF0;color:var(--deload);font-weight:600}
.banner.wu{background:#fff;border-left:4px solid var(--mauve);color:var(--sub)}
.dayhead{border-radius:14px;padding:14px;color:#fff;margin-bottom:12px}
.dayhead b{font-size:20px;display:block}
.ex .top{display:flex;gap:10px;align-items:flex-start}
.badge{flex:0 0 auto;min-width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.ex h3{margin:0;font-size:16.5px;line-height:1.25}
.meta{color:var(--sub);font-size:13.5px;margin-top:2px}
.note{font-size:13px;color:var(--sub);font-style:italic;margin-top:6px}
.target{margin-top:10px;padding:9px 11px;border-radius:10px;background:#F3E8EE;font-size:14.5px}
.target b{color:var(--plum)}
.target.up{background:var(--goodbg)}
.target.up b{color:var(--good)}
.inputs{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.field{flex:1;display:flex;flex-direction:column}
.field label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.field input{width:100%;font-size:20px;font-weight:700;padding:9px 10px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;-webkit-appearance:none}
.field input:focus{outline:none;border-color:var(--mauve)}
.field input.good{border-color:var(--good);background:var(--goodbg)}
.field input.bad{border-color:var(--bad);background:var(--badbg)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:14px;background:#F3E8EE;color:var(--plum)}
.btn.primary{background:var(--plum);color:#fff}
.how{margin-top:10px;display:none}
.how.open{display:block}
.how img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.how p{margin:8px 0 0;font-size:14px}
.how .mus{font-weight:700;color:var(--sub);font-size:13px}
.hist{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.hist div{flex:1 0 46px;text-align:center;font-size:11px;color:var(--sub);background:#FAF6F8;border-radius:8px;padding:4px 2px}
.hist div b{display:block;font-size:12.5px;color:var(--ink)}
.hist div.cur{outline:2px solid var(--mauve)}
.hist div.g{background:var(--goodbg)}.hist div.r{background:var(--badbg)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--plum)}
h2{font-size:17px;margin:4px 2px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#FAF6F8;border-radius:10px;padding:10px}
.stat small{display:block;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase}
.stat b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--sub);text-transform:uppercase}
td.g{color:var(--good);font-weight:700}td.r{color:var(--bad);font-weight:700}
select,input[type=date],input[type=text]{font-size:16px;padding:9px;border:2px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{flex:1;font-weight:600;font-size:14px}
.row input,.row select{flex:1.2}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--sub)}
.seg button.on{border-color:var(--plum);background:var(--plum);color:#fff}
#timer{position:fixed;inset:0;background:rgba(43,26,37,.94);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#timer.open{display:flex}
#tnum{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums}
#tname{font-size:16px;opacity:.8;padding:0 20px;text-align:center}
#timer .btns{width:min(90vw,360px)}
#timer .btn{background:rgba(255,255,255,.15);color:#fff;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--sub);font-size:13px}
svg.chart{width:100%;height:170px;display:block}
.saved{font-size:12px;color:var(--good);font-weight:700;margin-left:auto;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1 id="title">Juzzy Training</h1>
    <div class="wk"><button id="wkm" aria-label="Previous week">‹</button><span id="wkl">Week 1</span><button id="wkp" aria-label="Next week">›</button></div></div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>
<nav id="nav">
 <button data-t="workout" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout</button>
 <button data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progress</button>
 <button data-t="tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Daily</button>
 <button data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
</nav>
<div id="timer"><div id="tname"></div><div id="tnum">0:00</div><div class="btns"><button class="btn" id="tminus">−15s</button><button class="btn" id="tplus">+15s</button><button class="btn" id="tstop">Done</button></div></div>
<div class="toast" id="toast"></div>

aise arms out to shoulder height, lead with elbows, lower slowly. No swinging.", "cap": ["Arms by sides, soft elbows", "Lead with the elbows", "Hands to shoulder height"]}, {"id": "d1C2", "code": "C2", "name": "Cable Face Pull", "sets": 3, "min": 12, "max": 15, "rest": 60, "jump": 2.5, "note": "Rope to forehead, elbows high", "img": "face_pull", "mus": "Rear delts, upper back, rotator cuff", "cue": "Rope at head height. Pull towards forehead, elbows high, finish with hands beside ears.", "cap": ["Arms straight to rope", "Pull to face, elbows high", "Hands beside ears"]}, {"id": "d1D1", "code": "D1", "name": "EZ-Bar / DB Curl  (superset D2)", "sets": 3, "min": 8, "max": 12, "rest": 0, "jump": 1, "note": "Straight into D2", "img": "curl", "mus": "Biceps", "cue": "Elbows pinned at your sides. Curl up, squeeze, lower fully. No body swing.", "cap": ["Arms straight, elbows pinned", "Curl, no swinging", "Squeeze at the top"]}, {"id": "d1D2", "code": "D2", "name": "Cable Triceps Pushdown", "sets": 3, "min": 10, "max": 15, "rest": 60, "jump": 2.5, "note": "", "img": "pushdown", "mus": "Triceps", "cue": "Elbows locked at sides. Push down until arms are straight, control back up to chest height.", "cap": ["Hands at chest, elbows in", "Push down", "Arms straight, squeeze"]}, {"id": "d1E", "code": "E", "name": "Cable Chest Fly (high-to-low)", "sets": 3, "min": 12, "max": 15, "rest": 60, "jump": 2.5, "note": "CHEST – slight elbow bend, squeeze hands together", "img": "cable_fly", "mus": "Chest (inner/lower), front delts", "cue": "Pulleys high. Slight elbow bend, sweep hands down and together in front of hips, squeeze, return slowly.", "cap": ["Arms wide, slight bend", "Sweep down and in", "Hands meet, squeeze chest"]}], "wu": "5 min easy cardio → Band pull-aparts ×15 → Push-ups ×10 → Dead hang 20 s"}, {"name": "Lower A", "focus": "Quads", "color": "#2E5E7A", "ex": [{"id": "d2A", "code": "A", "name": "Back Squat or Hack Squat", "sets": 4, "min": 6, "max": 10, "rest": 150, "jump":   <div class="card"><h2 style="margin-top:0">Backup</h2><p class="muted" style="margin-top:0">Your data lives only on this phone. Save a backup now and then (e.g. to Files or email it to yourself).</p>
  <div class="btns"><button class="btn primary" id="exp">Save backup</button><button class="btn" id="imp">Restore backup</button></div><input type="file" id="impf" accept=".json,application/json" style="display:none"></div>
  <div class="card"><h2 style="margin-top:0">How it works</h2><p class="muted" style="margin:0">Log the weight and the reps of your <b>lowest</b> set. When that hits the top of the rep range, the app tells you to go up. Last set 0–1 reps from failure, other sets 1–2 in reserve. Week 6 is a deload.</p></div>
  <div class="card"><button class="btn" id="rst" style="width:100%;color:#A3132A">Start a new block (clear workout logs)</button></div>
  <p class="muted" style="text-align:center">Works offline once added to your Home Screen.</p>`;
  $('#main').innerHTML=h;
  $('#sd').onchange=e=>{if(e.target.value){S.start=e.target.value;save();week=S.weekOverride||autoWeek();header();toast('Saved')}};
  $('#wo').onchange=e=>{S.weekOverride=e.target.value?+e.target.value:null;save();week=S.weekOverride||autoWeek();header();toast('Saved')};
  [['tp','protein'],['tw','water'],['ts','sleep']].forEach(([id,k])=>$('#'+id).onchange=e=>{S.targets[k]=+e.target.value||S.targets[k];save();toast('Saved')});
  $('#exp').onclick=async()=>{const txt=JSON.stringify(S),name='juzzy-backup-'+iso(new Date())+'.json';
    try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();toast('Backup saved')};
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.logs||!o.daily)throw 0;S=o;save();week=S.weekOverride||autoWeek();render();toast('Backup restored')}catch(_){toast('That file is not a valid backup')}})};
  $('#rst').onclick=()=>{if(confirm('Clear all workout logs and start a new 6-week block from today? (Daily tracker entries are kept.) Save a backup first if unsure.')){S.logs={};S.start=iso(new Date());S.weekOverride=null;save();week=autoWeek();render();toast('New block started')}};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
$('#wkm').onclick=()=>{week=Math.max(1,week-1);render()};$('#wkp').onclick=()=>{week=Math.min(6,week+1);render()};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
